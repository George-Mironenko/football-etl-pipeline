name: Build

on:
  push:
    branches:
      - docker-scv-fail

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start Docker
        run: |
          docker compose up --build

